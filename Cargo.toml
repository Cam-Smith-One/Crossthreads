[workspace]
resolver = "2"
members = [
    "crates/ct-core",
    "crates/ct-connectors",
    "crates/ct-embed",
    "crates/ct-store",
    "crates/ct-daemon",
    "crates/ct-cli",
    "crates/ct-mcp",
]
# ct-desktop (Tauri) is intentionally not scaffolded yet — it needs a Node
# toolchain and isn't on the Phase 0 critical path (parsers + pipeline first).

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Cam-Smith-One/Crossthreads"
rust-version = "1.80"

[workspace.dependencies]
ct-core = { path = "crates/ct-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "5"
