[package]
name = "ct-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Crossthreads command-line interface."

[[bin]]
name = "crossthreads"
path = "src/main.rs"

[features]
default = []
# Real semantic embeddings (all-MiniLM via ONNX). Off by default so the CLI
# builds fast; enable with `cargo build -p ct-cli --features onnx`.
onnx = ["ct-embed/onnx", "ct-index/onnx"]

[dependencies]
ct-core = { workspace = true }
ct-connectors = { path = "../ct-connectors" }
ct-store = { path = "../ct-store" }
ct-embed = { path = "../ct-embed" }
ct-index = { path = "../ct-index" }
ct-daemon = { path = "../ct-daemon" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
